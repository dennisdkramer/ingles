<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- build: 2026-10-20T00:00:00Z -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Opens Doors</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body>
<header class="brand"><img src="logo.png" onerror="this.outerHTML='<div class=logoFallback>🐕‍</div>'"><h1>ENGLISH <span>OPENS DOORS</span></h1><p class="script">Let's go</p></header>
<div id="controlbar" class="control-bar"><span id="acct" class="dim" hidden></span> <button id="logout" hidden>Logout</button></div>
<main><div class="page-container"><div class="content-area">
 <div class="card center" id="gcard"><p class="dim">Entre com sua conta Google.</p><div id="gbtn"></div></div>
 <div id="app"></div><p id="debug" class="dim"></p>
</div>
<footer>MATERIAIS SIMPLES E INOVADORES · INGLES CERTO EUA</footer>
</div></main>
<script>
const CLIENT_ID="872457390510-jsk9pooj688ogvp6hs9ca4js3iqk5n69.apps.googleusercontent.com";
const SECRET="abreportas2025";
const BACKPACK="https://script.google.com/macros/s/AKfycbxSR8UmOwosLIgn1-AGKhgXJvdqOVkzMqrTwdlWNF9kOkt-256TqTacOsQlo6JyHplR/exec";
const COUNTS={kids:1,business:36,nsfw:1};
const TN={kids:"Kids 🛹",business:"Business 💼",nsfw:"Adultos 🔞"};
const $=id=>document.getElementById(id);
const log=m=>{debug.innerHTML+="› "+m+"<br>"};
const h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return x};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cred=null,profile=null,teacher=false,studentName="";
const SESSION_KEY="eod_session";
async function api(action,obj){
 const body=Object.assign({action:action},obj||{});
 try{const r=await fetch(BACKPACK,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});return await r.json();}
 catch(e){return {error:String(e)}}
}
function decodeJwt(t){
 let b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
 return JSON.parse(atob(b));
}
window.addEventListener("load",()=>{let tries=0;
 (function ready(){
  if(!window.google){if(++tries<5){setTimeout(ready,1200);return}log("ERRO: script Google não carregou.");return}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onLogin,auto_select:true});
  google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",shape:"pill"});
  if(restoreSession()){start();}else{try{google.accounts.id.prompt()}catch(e){}}
 })();
});
function onLogin(resp){
 cred=resp.credential;profile=decodeJwt(cred);persistSession();
 log("login OK: "+profile.email);start();
}
function persistSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify({cred:cred,profile:profile,name:studentName}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function restoreSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(s&&s.cred&&s.profile&&s.profile.email){cred=s.cred;profile=s.profile;studentName=s.name||"";return true}}catch(e){}return false}
async function start(){
 try{const r=await fetch("access.json?"+Date.now());if(!r.ok)throw new Error("access.json não encontrado (HTTP "+r.status+")");teacher=(await r.json()).teachers.includes(profile.email);}
 catch(e){$("app").innerHTML='<div class="card">⚠️ '+e.message+"</div>";return}
 showAcct();
 if(teacher){renderTeacher();return}
 const st=await api("status",{token:cred});
 if(st.error && /token/i.test(String(st.error))){clearSession();location.reload();return}
 if(st.status==="approved"){renderStudent(st.track, st.name);return}
 if(st.status==="pending"){$("app").innerHTML=pendingCard(profile.email,"Seu pedido de acesso já foi enviado e está aguardando o professor aprovar.");return}
 renderRequest();
}
function pendingCard(email,msg){
 return '<div class="card"><h3>Aguardando aprovação</h3><p class="dim">'+esc(email)+'</p><p>'+msg+'</p></div>';
}
function renderRequest(){
 $("app").innerHTML='<div class="card"><h3>Solicitar acesso</h3><p class="dim">'+esc(profile.email)+'</p><p>Esta conta ainda não está cadastrada. Envie um pedido para o professor aprovar.</p><button id="reqBtn">Enviar pedido de acesso</button></div>';
 $("reqBtn").onclick=async()=>{
  const b=$("reqBtn");b.disabled=true;b.textContent="Enviando…";
  const j=await api("request",{token:cred});
  if(j.status==="pending"){$("app").innerHTML=pendingCard(profile.email,"Pedido enviado! O professor vai aprovar seu acesso em breve.");}
  else{b.disabled=false;b.textContent="Enviar pedido de acesso";log("ERRO: "+(j.error||"desconhecido"))}
 };
}
function renderStudent(track,name){
 studentName=name||"";
 persistSession();
 const p=prog();
 let html='<div class="card">Olá, <b>'+esc(profile.name||profile.email)+'</b> · <button onclick="logout()">trocar conta</button></div>';
 html+='<div class="card"><h3>'+TN[track]+'</h3>';let cont=null;
 for(let i=1;i<=COUNTS[track];i++){const d=p[track+"_"+i];if(!d&&!cont)cont=i;
  html+='<div class="row">'+(d?'<span class="done">✅ Lição '+i+"</span>":'<span class="todo">⬜ Lição '+i+"</span>")+' <button onclick="go(\''+track+"\',"+i+')">abrir</button></div>';}
 if(cont)html+='<button onclick="go(\''+track+"\',"+cont+')">▶ Continuar da lição '+cont+"</button>";
 html+='</div>';$("app").innerHTML=html;log("índice pronto ✔");
}
let QUEUE={pending:[],approved:[]};
function bookButton(t){
 let items='';
 for(let i=1;i<=COUNTS[t];i++)items+='<button type="button" onclick="go(\''+t+'\','+i+')">Lição '+i+'</button>';
 return '<div class="bookdrop"><button type="button" class="bookbtn" onclick="toggleBookMenu(\''+t+'\')">'+TN[t]+' ▾</button>'
  +'<div class="bookmenu" id="menu_'+t+'" hidden>'+items+'</div></div>';
}
window.toggleBookMenu=function(t){const m=$("menu_"+t);if(!m)return;const open=!m.hidden;document.querySelectorAll(".bookmenu").forEach(x=>x.hidden=true);if(!open)m.hidden=false;};
document.addEventListener("click",e=>{if(!e.target.closest(".bookdrop"))document.querySelectorAll(".bookmenu").forEach(x=>x.hidden=true);});
function pendingHTML(){
 let h='<div class="card tadmin-col"><h4>Pedidos pendentes</h4>';
 if(!QUEUE.pending.length)h+='<p class="dim">Nenhum pedido pendente.</p>';
 [...QUEUE.pending].sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email)).forEach(q=>{
  h+='<div class="tadmin-item"><div><b>'+esc(q.name||q.email)+'</b> <span class="dim">'+esc(q.email)+'</span></div>'
   +'<div><select id="book_'+esc(q.email)+'"><option value="kids">Kids 🛹</option><option value="business" selected>Business 💼</option><option value="nsfw">Adultos 🔞</option></select></div>'
   +'<div><button onclick="decide(\''+esc(q.email)+'\',\'approve\')">Aprovar</button> <button onclick="decide(\''+esc(q.email)+'\',\'reject\')">Recusar</button></div></div>';
 });
 return h+'</div>';
}
function approvedHTML(){
 let h='<div class="card tadmin-col"><h4>Alunos aprovados</h4>';
 if(!QUEUE.approved.length)h+='<p class="dim">Nenhum aluno aprovado ainda.</p>';
 [...QUEUE.approved].sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email)).forEach(s=>{
  const next=(s.lastCompleted||0)+1;
  const atEnd=next>COUNTS[s.track];
  h+='<div class="tadmin-item trow">'
   +'<b class="tname">'+esc(s.name||s.email)+'</b>'
   +'<button class="jumpbtn"'+(atEnd?' disabled':'')+' onclick="goStudent(\''+s.track+'\','+(atEnd?COUNTS[s.track]:next)+',\''+s.email+'\')">⏭ '+TN[s.track]+' '+(atEnd?COUNTS[s.track]:next)+'</button>'
   +'<button class="remlink" onclick="removeStudent(\''+s.email+'\')">Remover</button>'
   +'<span class="dim temail">'+esc(s.email)+'</span>'
   +'</div>';
 });
 return h+'</div>';
}
async function renderTeacher(){
 $("app").innerHTML='<div class="card tadmin"><div class="tadmin-books">'
  +bookButton("kids")+bookButton("business")+bookButton("nsfw")
  +'</div></div><div class="tadmin-cols" id="tcols"><p class="dim">Carregando…</p></div>';
 const j=await api("queue",{token:cred});
 if(j.error){ if(/token/i.test(String(j.error))){clearSession();location.reload();return} $("tcols").innerHTML='<div class="card tadmin-col"><p class="todo">Não foi possível carregar os pedidos: '+esc(j.error)+'</p></div>';return }
 QUEUE={pending:j.pending||[],approved:j.approved||[]};
 $("tcols").innerHTML=pendingHTML()+approvedHTML();
}
window.decide=async function(email,action){
 const q=QUEUE.pending.find(x=>x.email===email);if(!q)return;
 const track=action==="approve"?$("book_"+email).value:undefined;
 const j=await api(action,{token:cred,email:q.email,track:track});
 if(j.result==="ok"){log((action==="approve"?"Aprovado":"Recusado")+" ✔");renderTeacher();}
 else log("ERRO: "+(j.error||"desconhecido"));
};
window.removeStudent=async function(email){
 const s=QUEUE.approved.find(x=>x.email===email);if(!s)return;
 if(!confirm("Remover aluno "+(s.name||s.email)+"?"))return;
 const j=await api("remove",{token:cred,email:s.email});
 if(j.result==="ok"){log("Removido ✔");renderTeacher();}
 else log("ERRO: "+(j.error||"desconhecido"));
};
const prog=()=>JSON.parse(localStorage.getItem("prog_"+profile.email)||"{}");
function go(t,i){sessionStorage.gate=JSON.stringify({email:profile.email,track:t,teacher,teacherName:teacher?(profile.name||""):"",name:teacher?(profile.name||""):studentName,sig:h(profile.email+t+SECRET)});location=t+"/lesson"+i+".html";}
function goStudent(t,i,email){const s=QUEUE.approved.find(x=>x.email===email);sessionStorage.gate=JSON.stringify({email:profile.email,track:t,teacher:true,teacherName:profile.name||"",name:s?(s.name||""):"",student:email,sig:h(profile.email+t+SECRET)});location=t+"/lesson"+i+".html";}
function showAcct(){const c=$("controlbar").querySelector("#acct"),lo=$("controlbar").querySelector("#logout");c.hidden=false;c.innerHTML="Signed in: <b>"+profile.email+"</b>";lo.hidden=false;lo.onclick=logout;const g=$("gcard");if(g)g.hidden=true;}
function logout(){clearSession();if(window.google&&google.accounts&&google.accounts.id)try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload();}
</script></body></html>
