<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>width fixture — bad</title>
</head>
<body>
<main id="page"><div class="page-container"><div class="content-area">
  <h1>Width fixture — bad</h1>

  <!-- a 2-row that mixes a half with a third -->
  <div class="itemrow" data-cols="2">
    <section class="card itemsize-half"><h2>Half A</h2><p>Mixed row.</p></section>
    <section class="card itemsize-third"><h2>Third in a 2-row</h2><p>Mixed row.</p></section>
  </div>

  <!-- a lone third, outside any row -->
  <section class="card itemsize-third"><h2>Lone third</h2><p>No row around it.</p></section>

  <!-- an incomplete row, and a member that dials its own width -->
  <div class="itemrow" data-cols="3">
    <section class="card itemsize-third"><h2>Only one</h2><p>A 3-row needs three members.</p></section>
    <section class="card itemsize-third" style="width:40%"><h2>Dialled</h2><p>The size class owns the width.</p></section>
  </div>

  <!-- a row with no data-cols at all -->
  <div class="itemrow">
    <section class="card itemsize-half"><h2>A</h2><p>No data-cols.</p></section>
    <section class="card itemsize-half"><h2>B</h2><p>No data-cols.</p></section>
  </div>

  <!-- a retired class that must not be generated any more -->
  <div class="grid3">
    <section class="card"><h2>Retired</h2><p>The .grid3 grid is gone.</p></section>
  </div>

  <!-- a group emitted bare into the page flow (no block around it) -->
  <div class="qgrid stack">
    <div class="qitem"><div class="qline"><span class="qnum">1.</span><span class="qstem">Which one?</span><label><input type="radio" name="bare" value="a">sit</label><label><input type="radio" name="bare" value="b">sat</label></div></div>
  </div>

  <!-- a chart that prescribes its own columns (its CONTENT should decide) -->
  <table class="chart" data-cols="2">
    <thead><tr><th>Form</th><th>Use</th></tr></thead>
    <tbody><tr><td>I work</td><td>a habit</td></tr></tbody>
  </table>
</div></div></main>
</body>
</html>
