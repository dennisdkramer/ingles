<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inglês Abre Portas — Portal</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body>
<header class="brand"><img src="logo.png" onerror="this.outerHTML='<div class=logoFallback>🐕‍</div>'"><h1>INGLÊS <span>ABRE PORTAS</span></h1><p class="script">Vamos lá</p></header>
<main>
 <div class="card center" id="gcard"><p class="dim">Entre com a conta Google cadastrada pelo professor.</p><div id="gbtn"></div></div>
 <div id="app"></div><p id="debug" class="dim"></p>
</main>
<footer>MATERIAIS SIMPLES E INOVADORES · INGLES CERTO EUA</footer>
<script>
const CLIENT_ID="872457390510-jsk9pooj688ogvp6hs9ca4js3iqk5n69.apps.googleusercontent.com";
const SECRET="abreportas2025";
const COUNTS={kids:0,business:1,nsfw:0};
const TN={kids:"Kids 🛹",business:"Business 💼",nsfw:"Adultos 🔞"};
const $=id=>document.getElementById(id);
const log=m=>{debug.innerHTML+="› "+m+"<br>"};
const h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return x};
let user=null,access=null,teacher=false;
window.addEventListener("load",()=>{const s=localStorage.sess;
 if(s){user=JSON.parse(s);log("sessão lembrada: "+user.email);start();}else boot();});
let tries=0;
function boot(){
 if(!window.google){if(++tries<5){setTimeout(boot,1200);return}log("ERRO: script Google não carregou.");return}
 google.accounts.id.initialize({client_id:CLIENT_ID,callback:r=>{
  let b=r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
  user=JSON.parse(atob(b));localStorage.sess=JSON.stringify(user);log("login OK: "+user.email);start();}});
 google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",shape:"pill"});
}
async function start(){
 try{const r=await fetch("access.json?"+Date.now());if(!r.ok)throw new Error("access.json não encontrado (HTTP "+r.status+")");access=await r.json();}
 catch(e){$("app").innerHTML='<div class="card">⚠️ '+e.message+"</div>";return}
 access.teachers=access.teachers||[];access.students=access.students||{};
 teacher=access.teachers.includes(user.email);
 const stu=access.students[user.email];
 if(!teacher&&!stu){$("app").innerHTML='<div class="card">⛔ <b>'+user.email+'</b> não está cadastrado.<br>Fale com seu professor.</div>';return}
 render(stu);
}
const prog=()=>JSON.parse(localStorage.getItem("prog_"+user.email)||"{}");
function go(t,i){sessionStorage.gate=JSON.stringify({email:user.email,track:t,teacher,sig:h(user.email+t+SECRET)});location=t+"/lesson"+i+".html";}
function render(stu){
 let html='<div class="card">Olá, <b>'+user.name+'</b> · <button onclick="logout()">trocar conta</button></div>';
 if(teacher){
  html+='<div class="card"><h3>Modo professor — escolha o livro que vai acompanhar</h3><p class="dim">Cada livro é separado: conteúdo, alunos e progresso próprios.</p>';
  for(const t of["kids","business","nsfw"])
   html+='<div class="row"><b>'+TN[t]+'</b> '+(COUNTS[t]?'<button onclick="go(\''+t+'\',1)">entrar</button>':'<span class="todo">🚧 em construção</span>')+'</div>';
  $("app").innerHTML=html+"</div>";return;
 }
 const t=stu.track,p=prog();
 html+='<div class="card"><h3>'+TN[t]+'</h3>';let cont=null;
 for(let i=1;i<=COUNTS[t];i++){const d=p[t+"_"+i];if(!d&&!cont)cont=i;
  html+='<div class="row">'+(d?'<span class="done">✅ Lição '+i+(d.score!=null?" · quiz "+d.score+"%":"")+"</span>":'<span class="todo">⬜ Lição '+i+"</span>")+' <button onclick="go(\''+t+"\',"+i+')">abrir</button></div>';}
 if(cont)html+='<button onclick="go(\''+t+"\',"+cont+')">▶ Continuar da lição '+cont+"</button>";
 html+='</div>';$("app").innerHTML=html;log("índice pronto ✔");
}
function logout(){delete localStorage.sess;location.reload();}
</script></body></html>
